<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - FarmerAdvisor</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-page {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .auth-box {
            width: 450px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        .auth-box h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .auth-box .subtitle {
            text-align: center;
            color: #68736b;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5ddd3;
            border-radius: 7px;
            font-size: 15px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4d8b36;
        }

        .auth-submit {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #4d8b36;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .auth-submit:hover {
            background: #3d722c;
        }

        .auth-link {
            text-align: center;
            margin-top: 20px;
        }

        .auth-link a {
            color: #4d8b36;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <nav class="navbar">

        <div class="logo">
            🌾 Farmer<span>Advisor</span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="ai-assistant.html">AI Assistant</a></li>
            <li><a href="crop-advisory.html">Crop Advisory</a></li>
            <li><a href="weather.html">Weather</a></li>
            <li><a href="mandi.html">Mandi Prices</a></li>
            <li><a href="salt-production.html">Salt Production</a></li>
        </ul>

        <div class="auth-buttons">
            <a href="login.html" class="login-btn">Login</a>
        </div>

    </nav>
</header>


<section class="auth-page">

    <div class="auth-box">

        <h2>👨‍🌾 Create Account</h2>

        <p class="subtitle">
            Join the Farmer Advisory Platform
        </p>

        <div id="message" class="message"></div>

        <form id="registerForm">

            <div class="form-group">
                <label>Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter mobile number"
                    required
                >
            </div>

            <div class="form-group">
                <label>Farmer Type</label>

                <select id="farmerType">
                    <option value="Farmer">Farmer</option>
                    <option value="Salt Producer">Salt Producer</option>
                    <option value="Agriculture Expert">Agriculture Expert</option>
                    <option value="Student">Student</option>
                </select>
            </div>

            <div class="form-group">
                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    required
                >
            </div>

            <button type="submit" class="auth-submit">
                Create Account
            </button>

        </form>

        <div class="auth-link">
            Already have an account?
            <a href="login.html">Login here</a>
        </div>

    </div>

</section>


<script>

document.getElementById("registerForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;

    // Temporary registration
    localStorage.setItem("farmerName", name);
    localStorage.setItem("farmerEmail", email);

    document.getElementById("message").innerHTML =
        "✅ Registration successful!";

    setTimeout(function() {
        window.location.href = "login.html";
    }, 1000);

});

</script>

</body>
</html>
