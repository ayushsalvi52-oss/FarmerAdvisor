<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - FarmerAdvisor</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .auth-page {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .auth-box {
            width: 430px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        .auth-box h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #68736b;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5ddd3;
            border-radius: 7px;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4d8b36;
        }

        .auth-submit {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #4d8b36;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .auth-submit:hover {
            background: #3d722c;
        }

        .auth-link {
            text-align: center;
            margin-top: 20px;
        }

        .auth-link a {
            color: #4d8b36;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }

    </style>

</head>


<body>

<header>

    <nav class="navbar">

        <div class="logo">
            🌾 Farmer<span>Advisor</span>
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="ai-assistant.html">AI Assistant</a>
            </li>

            <li>
                <a href="crop-advisory.html">Crop Advisory</a>
            </li>

            <li>
                <a href="weather.html">Weather</a>
            </li>

            <li>
                <a href="mandi.html">Mandi Prices</a>
            </li>

        </ul>

        <div class="auth-buttons">

            <a href="register.html" class="register-btn">
                Register
            </a>

        </div>

    </nav>

</header>


<section class="auth-page">

    <div class="auth-box">

        <h2>👨‍🌾 Welcome Back</h2>

        <p class="subtitle">
            Login to your FarmerAdvisor account
        </p>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-submit">

                Login

            </button>

        </form>


        <div class="auth-link">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>

    </div>

</section>


<script>

document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value;

    const registeredEmail =
        localStorage.getItem("farmerEmail");

    if (email === registeredEmail) {

        localStorage.setItem("loggedIn", "true");

        document.getElementById("message").innerHTML =
            "✅ Login successful!";

        setTimeout(function() {

            window.location.href =
                "dashboard.html";

        }, 800);

    } else {

        document.getElementById("message").innerHTML =
            "❌ Account not found. Please register first.";

    }

});

</script>

</body>

</html>
